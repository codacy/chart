[SERVICE]
    Flush                     5
    Log_Level                 info
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /buffer/flb-storage/
    storage.sync              normal
    storage.backlog.mem_limit 8M

# Container log files are named <pod>_<namespace>_<container>-<id>.log: the path keeps other namespaces out
[INPUT]
    Name              tail
    Tag               kube.*
    Path              /var/log/containers/*_${NAMESPACE}_*.log
    multiline.parser  cri
    DB                /buffer/tail.db
    Mem_Buf_Limit     16MB
    Skip_Long_Lines   On
    # Tool pods live for seconds: look for new files every second and read them from the start (the DB keeps
    # positions, so a restart doesn't ship anything twice)
    Refresh_Interval  1
    Read_from_Head    On
    Rotate_Wait       30
    storage.type      filesystem

[FILTER]
    Name             kubernetes
    Match            kube.*
    Kube_Tag_Prefix  kube.var.log.containers.
    Merge_Log        Off
    Labels           On
    Annotations      Off
    Buffer_Size      0

[FILTER]
    Name    lua
    Match   kube.*
    script  /fluent-bit/etc/categorize.lua
    call    categorize

[FILTER]
    Name                  rewrite_tag
    Match                 kube.*
    Rule                  $log_category ^(.+)$ logs.$log_category.$pod_name.$container_name false
    Emitter_Name          by_category
    Emitter_Storage.type  filesystem

# Only the log line itself is stored (the app's own timestamp and level are in it)
[OUTPUT]
    Name                          s3
    Match                         logs.*
    bucket                        ${LOGS_BUCKET}
    region                        ${S3_REGION}
    endpoint                      ${S3_ENDPOINT}
    use_put_object                On
    compression                   gzip
    total_file_size               5M
    upload_timeout                1m
    log_key                       log
    s3_key_format                 /$TAG[1]/$TAG[2]/$TAG[3]/%Y-%m-%d/%H-%M-%S-$UUID.gz
    s3_key_format_tag_delimiters  .
    store_dir                     /buffer/s3
    retry_limit                   5
