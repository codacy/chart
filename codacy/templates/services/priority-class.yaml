{{- if .Values.priorityClass.create }}
# worker-manager's chart schedules its pod with this PriorityClass (cloud's clusters define it). Cluster-wide: set
# priorityClass.create: false where the cluster already has one named critical-service
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: critical-service
  labels:
    {{- include "codacy.labels" . | indent 4 }}
value: 1000000
globalDefault: false
description: "Codacy services scheduled ahead of others (worker-manager)"
{{- end }}
