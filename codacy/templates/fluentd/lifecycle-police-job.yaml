{{ if .Values.fluentdoperator.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-fluentd-lifecycle-policy-creator"
  labels:
    {{- include "codacy.labels" . | indent 4 }}
  annotations:
    # This is what defines this resource as a hook. Without this line, the
    # job is considered part of the release.
    "helm.sh/hook": post-install,post-upgrade
    # The RustFS bucket-creation hook (rustfs.extraManifests) doesn't define
    # any hook weight, any positive value will ensure that the bucket is created before this
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      name: "{{ .Release.Name }}"
      labels:
        {{- include "codacy.labels" . | indent 8 }}
    spec:
      restartPolicy: Never
      containers:
      - name: fluentd-lifecycle-policy-creator
        image: "mesosphere/aws-cli:1.14.5"
        env:
          - name: AWS_ACCESS_KEY_ID
            value: "{{ .Values.global.minio.accessKey }}"
          - name: AWS_SECRET_ACCESS_KEY
            value: "{{ .Values.global.minio.secretKey }}"
        command: ["/bin/sh", "-c"]
        args:
          - |
            ENDPOINT="http://{{ .Values.global.minio.location }}:{{ .Values.global.minio.port }}"
            BUCKET="{{ .Values.fluentdoperator.bucketName }}"
            LIFECYCLE='{"Rules":[{"Expiration":{"Days": {{ .Values.fluentdoperator.expirationDays }} },"Filter":{},"ID":"Delete old logs","Status":"Enabled"}]}'
            MAX_WAIT=1200
            ELAPSED=0
            echo "Waiting for MinIO bucket ${BUCKET} at ${ENDPOINT}..."
            echo "Lifecycle configuration set successfully."
{{ end }}
