portal:
  replicaCount: 1
  resources:
    limits:
      memory: 500Mi

remote-provider-service:
  replicaCount: 1
  resources:
    limits:
      memory: 500Mi

# Listeners (listener-<provider>) use a small emptyDir cache: nothing to size here

engine:
  resources:
    limits:
      cpu: 1
      memory: 2Gi

codacy-tools:
  resources:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

worker-manager:
  replicaCount: 1
  resources:
    limits:
      memory: 500Mi
  config:
    workerResources:
      limits:
        memory: "2Gi"

crow:
  resources:
    limits:
      cpu: 0.5
      memory: 750Mi

rabbitmq-ha:
  replicaCount: 1
  image:
    repository: bitnamilegacy/rabbitmq
    tag: "3.8.35-debian-11-r5"
  resources:
    limits:
      cpu: 0.5
      memory: 1500Mi

codacy-spa:
  replicaCount: 1
  resources:
    limits:
      memory: 1000Mi

# vNext services, sized as on a small single-node install (heap at 60% of the limit, serial GC)
seat-service:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  config: { javaOpts: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
analysis-scheduler:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  config: { javaToolOptions: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
coverage-service:
  resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { memory: 512Mi } }
  config: { javaOpts: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
metrics-aggregation-service:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  config: { javaOpts: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
srm-service:
  resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { memory: 512Mi } }
  config: { javaToolOptions: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
ai-inventory-service:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 384Mi } }
  config: { javaToolOptions: "-XX:+UseSerialGC -XX:MaxRAMPercentage=60.0" }
valkey:
  maxMemory: 48mb
  resources: { requests: { memory: 16Mi }, limits: { memory: 96Mi } }
