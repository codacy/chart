  # postgresqlUsername, postgresqlPassword, postgresqlDatabase and service.port to put one elsewhere, e.g.
  # seatdb: { host: my-postgres.example.com }
  # metricsaggregationdb needs the pg_partman and pg_cron extensions on its server (pg_cron bound to that database).
  # coverage-service needs a Postgres instance of its own: its migrations create pg_cron, which an instance allows in
  # one database only. The bundled one, or set this to yours:
  coveragedb:
    host: codacy-postgres-coverage

  crowdb:
    create: false
    host: codacy-postgres
