## YOU ARE NOT ADVISED TO CHANGE BEYOND THIS POINT

## Defaults for Internal Storage coming from requirements
## These values are ignored if 'create: false' in the global variables

rabbitmq-ha:
  rabbitmqErlangCookie: "PLEASE_CHANGE_ME_TO_A_RANDOM_STR" # Generate one with `cat /dev/urandom | tr -dc 'a-zA-Z0-9' | fold -w 32 | head -n 1`
  fullnameOverride: codacy-rabbitmq-ha
  global:
    imagePullSecrets:
    - docker-credentials
  image:
    repository: bitnamilegacy/rabbitmq
    tag: "3.8.5"
  auth:
    username: rabbitmq-codacy
    password: CHANGEME
  memoryHighWatermark:
    enabled: true
    type: relative
    value: 0.4
  # memoryHighWatermark.enabled above requires resources.limits.memory to be
  # set to a valid Kubernetes quantity string - the rabbitmq-ha subchart's
  # own toBytes helper renders it directly and errors on a nil/unset value.
  # Every other subchart in this file sets its own limits/requests; this one
  # didn't, so a bare `helm install` with no values override crashed here.
  resources:
    limits:
      cpu: 1500m
      memory: 1600Mi
    requests:
      cpu: 1000m
      memory: 1000Mi
  prometheus:
    operator:
      enabled: false
  podManagementPolicy: Parallel
  forceBoot: true # Allows a graceful recovery from 'Waiting for Mnesia tables' in case all rabbitmq pods restart.
  loadDefinition: # Loads rabbitmq-secret.yaml to ensure that all queues are created upon rabbitmq restart.
    enabled: true
    existingSecret: rabbitmq-load-definition
  extraConfiguration: |
    management.load_definitions = /app/load_definition.json
  extraEnvVars:
    - name: ERL_MAX_PORTS
      value: "65536"

postgres:
  fullnameOverride: codacy-postgres
  image:
    repository: bitnamilegacy/postgresql
    tag: "11.7.0"
  persistence:
    enabled: false
    # storageClass:
    # size: 20Gi
  #resources:
  #  requests:
  #    memory: 1024Mi
  #    cpu: 1000m
  postgresqlExtendedConf: {"sharedBuffers": "256MB", "maxConnections": "300"}
  initdbScripts:
    initdb.sql: |
      CREATE USER codacy WITH PASSWORD 'codacy';
      ALTER ROLE codacy WITH CREATEDB;
      CREATE DATABASE accounts WITH OWNER=codacy;
      CREATE DATABASE analysis WITH OWNER=codacy;
      CREATE DATABASE results WITH OWNER=codacy;
      CREATE DATABASE metrics WITH OWNER=codacy;
      CREATE DATABASE filestore WITH OWNER=codacy;
      CREATE DATABASE jobs WITH OWNER=codacy;
      CREATE DATABASE listener WITH OWNER=codacy;
      CREATE DATABASE crow WITH OWNER=codacy;

# Bundled RustFS object store, replacing MinIO (its upstream images are no
# longer published on Docker Hub/Quay). Joins the `codacy-rustfs-svc` Service
# that global.minio.location points consumers at.
#
# IMPORTANT: secret.rustfs.access_key/secret_key below MUST be identical to
# global.minio.accessKey/secretKey above. If you change one, change both.
rustfs:
  fullnameOverride: codacy-rustfs
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  replicaCount: 1
  ingress:
    enabled: false
  storageclass:
    name: ""
    dataStorageSize: 40Gi
  resources:
    requests:
      memory: 1.5Gi
  config:
    rustfs:
      region: "eu-west-1"
  secret:
    rustfs:
      access_key: "AKIAIOSFODNN7EXAMPLE"
      secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  # Creates the buckets Codacy needs once RustFS is up (runs as part of
  # `helm install`/`helm upgrade`), replacing MinIO's own bucket-creation hook.
  extraManifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: '{{ include "rustfs.fullname" . }}-codacy-buckets'
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      spec:
        backoffLimit: 6
        template:
          spec:
            restartPolicy: Never
            containers:
              - name: make-buckets
                image: amazon/aws-cli:2.17.0
                env:
                  - name: S3
                    value: 'aws s3api --endpoint-url http://{{ include "rustfs.fullname" . }}-svc:9000'
                  - name: AWS_DEFAULT_REGION
                    value: eu-west-1
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: '{{ include "rustfs.secretName" . }}', key: RUSTFS_ACCESS_KEY } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: '{{ include "rustfs.secretName" . }}', key: RUSTFS_SECRET_KEY } }
                command: ["sh", "-ec"]
                args:
                  - |
                    until $S3 list-buckets >/dev/null 2>&1; do echo "waiting for RustFS..."; sleep 5; done
                    for b in analysis coverage cli-reports commit-diff logs; do
                      $S3 head-bucket --bucket "$b" 2>/dev/null || $S3 create-bucket --bucket "$b"
                      echo "bucket $b ready"
                    done
                    B=codacy-api-repository-list-bucket
                    $S3 delete-bucket --bucket "$B"
                    $S3 head-bucket --bucket "$B" 2>/dev/null || $S3 create-bucket --bucket "$B"
                    $S3 list-objects --bucket "$B"
                    $S3 put-bucket-lifecycle-configuration --bucket "$B" --lifecycle-configuration '{"Rules":[{"ID":"Expire repository lists","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":90}}]}'
                    echo "bucket $B ready (90-day expiry)"

worker-manager:
  create: true
  fullnameOverride: codacy-worker-manager
  config:
    play:
      logFile: logback.xml
    cloudAmqp: {} # This should be configured through global.rabbitmq.rabbitUsername and global.rabbitmq.rabbitPassword respectively
