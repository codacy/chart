      nginx.ingress.kubernetes.io/use-regex: "true"
    extraPaths:
    - backend:
        service:
          name: codacy-crow
          port:
            name: http
      path: /monitoring
      pathType: ImplementationSpecific

## If you set this to be enabled: true, you must clean up the fluentd job yourself
# 17.x log collection keys, kept so existing values files keep working: they now drive the Fluent Bit capture below
# (the archived kube-fluentd-operator is gone). enabled turns capture on, bucketName names the logs bucket and
# expirationDays sets how long logs are kept. The other 17.x keys under fluentdoperator are ignored.
fluentdoperator:
  enabled: true
  bucketName: logs
  expirationDays: 7

# Logs and support bundles. Fluent Bit keeps every Codacy pod's output in the logs bucket, by category (infrastructure,
# services, workers, tools); support bundles package logs and cluster state for Codacy support, from Admin > Support or
#   kubectl -n <namespace> create job --from=cronjob/codacy-support-bundle bundle-1
remote-provider-service:
  extraEnvFrom: [{ configMapRef: { name: codacy-remote-provider-service-settings } }, { secretRef: { name: codacy-remote-provider-service-settings } }]

codacy-tools:
  create: true
  extraEnvFrom: [{ configMapRef: { name: codacy-tools-settings } }, { secretRef: { name: codacy-tools-settings } }]

codacy-spa:
  extraEnvFrom: [{ configMapRef: { name: codacy-spa-settings } }, { secretRef: { name: codacy-spa-settings } }]

# Settings the vNext services need on a self-hosted install, generated from the global values (providers, databases,
# RabbitMQ, object storage, secrets) into a ConfigMap and a Secret per component, codacy-<component>-settings, which each
# component loads after its own. Add or override any setting here; values may reference others ({{ .Values.global... }}):
#   componentSettings:
#     website:
#       config: { CONFIG_FORCE_codacy_some_setting: "value" }
#       secrets: { SOME_SECRET: "{{ .Values.global.cacheSecret }}" }
componentSettings:
  # Database connection pools per service and database; sized for small installs, raise for large ones
  dbPool:
    maximumPoolSize: 10
    minimumIdle: 1
  # Analysis workers' work volume: claim (a volume from the default StorageClass) or nfs (an NFS sidecar, as in 17.x)
  workerVolumeType: claim
  # Worker pods older than this are deleted whatever their state: keep it above your longest analysis
  workerPodLifespanMinutes: 720

# One-time steps when upgrading a 17.x install
upgrade:
  # Empties 17.x's listener database (a work queue and a cache) so vNext's listener can build its own schema
  resetListenerDatabase: true
  # Creates the vNext services' databases that are missing (global.*db above), before an upgrade, or a fresh install
  # with external databases. The user needs CREATEDB, or create them beforehand
  createDatabases: true
  postgresImage: postgres:16.6-alpine

logging:
  # Defaults to the fluentdoperator values above
  bucket: null
  retentionDays: null
  s3:
    # Defaults to the bundled object store (global.minio.location and port)
    endpoint: null
    region: eu-west-1
  capture:
    # Defaults to fluentdoperator.enabled. Fluent Bit needs a read-only hostPath to /var/log: set false where the cluster
    # forbids it (Pod Security "baseline" or "restricted", EKS Fargate); bundles then read live logs instead
    enabled: null
    # hostPath keeps unsent logs and tail positions across restarts; emptyDir for clusters that only allow a read-only
    # /var/log (GKE Autopilot)
    buffer: hostPath
    image:
      repository: cr.fluentbit.io/fluent/fluent-bit
      tag: 4.0.3
      pullPolicy: IfNotPresent
    resources:
      requests: { memory: 32Mi }
      limits: { memory: 128Mi }
    tolerations: []
  supportBundles:
    enabled: true
    # Built from images/support-bundle in codacy-self-hosted-sh
    image:
      repository: codacy/codacy-support-bundle-sh
      tag: "0.1.1"
      pullPolicy: IfNotPresent
    bucket: support-bundles
    retentionDays: 14
    # Defaults for bundles started with kubectl (the UI sets them per bundle)
    sinceHours: 24
    categories: services,workers,infrastructure
    # How long a bundle job's pod waits for kubectl cp
    keepSeconds: 900

crow:
  create: true

# Database migrations (Play evolutions) of the central databases. 17.x's enterprise.conf no longer exists: with it
# ragnaros loads no configuration and applies nothing, so a fresh install would have no schema
ragnaros:
  config:
    play:
      configFile: production.conf

codacy-api:
  extraEnvFrom: [{ configMapRef: { name: codacy-website-settings } }, { secretRef: { name: codacy-website-settings } }]
  replicaCount: 2
  resources:
    limits:
      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 500m
      memory: 2000Mi

# One repository listener per Git provider, each serving its own work queue. They replace 17.x's single `listener`:
# each runs only while its provider is enabled under global (create: false leaves one out altogether). From 17.x's
# listener values only listener.listenerdb still applies (it wins over global.listenerdb, as in 17.x); replicaCount,
# resources and the NFS cache provisioner are now set per provider here.
listener-github:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: github }
  provider: gh
  fullnameOverride: codacy-listener-gh
  resources:
    limits: { memory: 512Mi }
listener-gitlab:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: gitlab }
  provider: gl
  fullnameOverride: codacy-listener-gl
  resources:
    limits: { memory: 512Mi }
listener-bitbucket:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: bitbucket }
  provider: bb
  fullnameOverride: codacy-listener-bb
  resources:
    limits: { memory: 512Mi }
listener-github-enterprise:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: githubEnterprise }
  provider: ghe
  fullnameOverride: codacy-listener-ghe
  resources:
    limits: { memory: 512Mi }
listener-gitlab-enterprise:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: gitlabEnterprise }
  provider: gle
  fullnameOverride: codacy-listener-gle
  resources:
    limits: { memory: 512Mi }
listener-bitbucket-enterprise:
  extraEnvFrom: [{ configMapRef: { name: codacy-listener-settings } }, { secretRef: { name: codacy-listener-settings } }]
  create: true
  selfHosted: { gitProvider: bitbucketEnterprise }
  provider: bbe
  fullnameOverride: codacy-listener-bbe
  resources:
    limits: { memory: 512Mi }

engine:
  # 17.x's enterprise config files no longer exist in vNext: without the right one the service loads no configuration
  config:
    play:
      configFile: production-engine.conf
  extraEnvFrom: [{ configMapRef: { name: codacy-engine-settings } }, { secretRef: { name: codacy-engine-settings } }]
  replicaCount: 1
  resources:
    limits:
      cpu: 2000m
      memory: 3000Mi
