      CREATE DATABASE metrics WITH OWNER=codacy;
      CREATE DATABASE filestore WITH OWNER=codacy;
      CREATE DATABASE jobs WITH OWNER=codacy;
      CREATE DATABASE listener WITH OWNER=codacy;
      CREATE DATABASE crow WITH OWNER=codacy;
      CREATE DATABASE seat WITH OWNER=codacy;
      CREATE DATABASE metricsaggregation WITH OWNER=codacy;
      CREATE DATABASE itemsdb WITH OWNER=codacy;
      CREATE DATABASE dependenciesdb WITH OWNER=codacy;
      CREATE DATABASE activeanalysisconfigdb WITH OWNER=codacy;
      CREATE DATABASE aiinventory WITH OWNER=codacy;
      CREATE DATABASE codacytoolsdb WITH OWNER=codacy;

# Bundled RustFS object store, replacing MinIO (its upstream images are no
# longer published on Docker Hub/Quay). Joins the `codacy-rustfs-svc` Service
# that global.minio.location points consumers at.
#
# IMPORTANT: secret.rustfs.access_key/secret_key below MUST be identical to
# global.minio.accessKey/secretKey above. If you change one, change both.
rustfs:
  fullnameOverride: codacy-rustfs
  mode:
    standalone:
      enabled: true
    distributed:
      enabled: false
  replicaCount: 1
  ingress:
    enabled: false
  storageclass:
    name: ""
    dataStorageSize: 40Gi
  resources:
    requests:
      memory: 1.5Gi
  config:
    rustfs:
      region: "eu-west-1"
  secret:
    rustfs:
      access_key: "AKIAIOSFODNN7EXAMPLE"
      secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  # Creates the buckets Codacy needs once RustFS is up (runs as part of
  # `helm install`/`helm upgrade`), replacing MinIO's own bucket-creation hook.
  extraManifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: '{{ include "rustfs.fullname" . }}-codacy-buckets'
        annotations:
          helm.sh/hook: post-install,post-upgrade
          helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      spec:
        backoffLimit: 6
        template:
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
            volumes:
              - name: tmp
                emptyDir: {}
            containers:
              - name: make-buckets
                image: amazon/aws-cli:2.17.0
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities:
                    drop: ["ALL"]
                volumeMounts:
                  - name: tmp
                    mountPath: /tmp
                env:
                  - name: HOME
                    value: /tmp
                  - name: S3
                    value: 'aws s3api --endpoint-url http://{{ include "rustfs.fullname" . }}-svc:9000'
                  - name: AWS_DEFAULT_REGION
                    value: eu-west-1
                  - name: AWS_ACCESS_KEY_ID
                    valueFrom: { secretKeyRef: { name: '{{ include "rustfs.secretName" . }}', key: RUSTFS_ACCESS_KEY } }
                  - name: AWS_SECRET_ACCESS_KEY
                    valueFrom: { secretKeyRef: { name: '{{ include "rustfs.secretName" . }}', key: RUSTFS_SECRET_KEY } }
                command: ["sh", "-ec"]
                args:
                  - |
                    until $S3 list-buckets >/dev/null 2>&1; do echo "waiting for RustFS..."; sleep 5; done
                    for b in analysis coverage cli-reports commit-diff logs; do
                      $S3 head-bucket --bucket "$b" 2>/dev/null || $S3 create-bucket --bucket "$b"
                      echo "bucket $b ready"
                    done
                    B=codacy-api-repository-list-bucket
                    $S3 head-bucket --bucket "$B" 2>/dev/null || $S3 create-bucket --bucket "$B"
                    $S3 put-bucket-lifecycle-configuration --bucket "$B" --lifecycle-configuration '{"Rules":[{"ID":"Expire repository lists","Status":"Enabled","Filter":{"Prefix":""},"Expiration":{"Days":90}}]}'
                    echo "bucket $B ready (90-day expiry)"

worker-manager:
  extraEnvFrom: [{ configMapRef: { name: codacy-worker-manager-settings } }, { secretRef: { name: codacy-worker-manager-settings } }]
  create: true
  fullnameOverride: codacy-worker-manager
  config:
    play:
      logFile: logback.xml
    cloudAmqp: {} # This should be configured through global.rabbitmq.rabbitUsername and global.rabbitmq.rabbitPassword respectively

# Object store buckets the services use and don't create themselves: created before an upgrade and after a fresh
# install (an existing one is left alone), and passed to every service that reads or writes them
storage:
  createBuckets: true
  image: amazon/aws-cli:2.17.0
  buckets:
    coverageReports: coverage-reports-manager-bucket
    coverageAnalysis: coverage-analysis-bucket
    metricsAggregationDayZero: metrics-aggregation-day-zero-bucket
    repositoryIssuesSnapshot: repository-issues-snapshot-bucket
    pullRequestIssuesSnapshot: pull-request-issues-snapshot-bucket
    srmDastReports: srm-dast-reports
    srmPentest: srm-pentest
    sbom: sbom-bucket
    sbomTemp: sbom-temp
    imageSbom: image-sbom
    aiInventorySnapshot: ai-inventory-snapshot-bucket
    analysisFileIssuesSummary: analysis-file-issues-summary-bucket
    relatedCodeGraph: related-code-graph-bucket
    organizationMetrics: organization-metrics-bucket
    repositorySetup: repository-setup-bucket
    fileContent: file-content-bucket

# The workers' analysis result cache. create: false and host: <your Redis or Valkey> to use your own
valkey:
  create: true
  host: ""
  port: 6379
  image: valkey/valkey:9.1.3-alpine
  maxMemory: 256mb
  resources:
    requests: { memory: 32Mi }
    limits: { memory: 384Mi }

# The critical-service PriorityClass worker-manager's pod asks for (cluster-wide). false if your cluster already has it
priorityClass:
  create: true

# Answers the website's calls to services a self-hosted install doesn't run with a quick 501
unavailableServices:
  image: nginxinc/nginx-unprivileged:1.30.6-alpine

# ---- vNext services that 17.x didn't have. create: false leaves one out (the website then gets
# codacy-unavailable-services' quick 501 for it). Their settings come from componentSettings, like the others'.

# Seat counting for the license (required: website and the listeners call it)
seat-service:
  create: true
  fullnameOverride: codacy-seat-service
  extraEnvFrom: [{ configMapRef: { name: codacy-seat-service-settings } }, { secretRef: { name: codacy-seat-service-settings } }]

# Nightly SCA analyses of every repository, which fill the dependencies pages
analysis-scheduler:
  create: true
  fullnameOverride: codacy-analysis-scheduler
  extraEnvFrom: [{ configMapRef: { name: codacy-analysis-scheduler-settings } }, { secretRef: { name: codacy-analysis-scheduler-settings } }]

# Coverage reports and the coverage pages; its own Postgres (coveragedb), see global.coveragedb
coverage-service:
  create: true
  fullnameOverride: codacy-coverage-service
  extraEnvFrom: [{ configMapRef: { name: codacy-coverage-service-settings } }, { secretRef: { name: codacy-coverage-service-settings } }]

# The organization overview's quality metrics
metrics-aggregation-service:
  create: true
  fullnameOverride: codacy-metrics-aggregation-service
  extraEnvFrom: [{ configMapRef: { name: codacy-metrics-aggregation-service-settings } }, { secretRef: { name: codacy-metrics-aggregation-service-settings } }]

# Security and risk management: the security dashboard, findings and dependencies
srm-service:
