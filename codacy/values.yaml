      cpu: 1000m
      memory: 2000Mi
    requests:
      cpu: 500m
      memory: 2000Mi

engine:
  replicaCount: 1
  resources:
    limits:
      cpu: 2000m
      memory: 3000Mi
    requests:
      cpu: 200m
